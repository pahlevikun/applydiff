<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="Branching hunks vs. whole-document rewrites">
  <!-- Editorial Paper Canvas (tokens-root.css: paper #fbfaf7, paper-line #e6e3db, ink #1c1f25, ink-mut #606772) -->
  <rect x="1" y="1" width="1198" height="628" rx="12" fill="#fbfaf7" stroke="#e6e3db" stroke-width="2" />

  <!-- Top Editorial Kicker & Header -->
  <text x="56" y="54" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" fill="#b86b11" letter-spacing="1.2">
    01 / BINARY COMPARISON &#183; ARCHITECTURE OF CONTROL
  </text>
  <text x="56" y="92" font-family="IBM Plex Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#1c1f25" letter-spacing="-0.5">
    Branching field hunks vs. whole-document AI rewrites
  </text>
  <text x="56" y="120" font-family="IBM Plex Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#606772">
    Both workflows start from 1 master CV and apply to 3 jobs. Only one preserves provenance and bounds human review to what changed.
  </text>

  <line x1="56" y1="142" x2="1144" y2="142" stroke="#e6e3db" stroke-width="1.5" />

  <!-- Shared Scale Axis (Far Left Column: x=56..200) -->
  <g font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#8d929b">
    <text x="56" y="176">COMMON SCALE</text>
    <text x="56" y="232" fill="#1c1f25">01. Source of truth</text>
    <text x="56" y="250" font-weight="400" fill="#606772">Canonical input</text>

    <text x="56" y="346" fill="#1c1f25">02. AI mutation unit</text>
    <text x="56" y="364" font-weight="400" fill="#606772">Per job application</text>

    <text x="56" y="458" fill="#1c1f25">03. Fact &amp; metric gate</text>
    <text x="56" y="476" font-weight="400" fill="#606772">Hallucination check</text>

    <text x="56" y="548" fill="#1c1f25">04. Review surface</text>
    <text x="56" y="566" font-weight="400" fill="#606772">Across 3 applications</text>
  </g>

  <!-- Horizontal Grid Hairlines across both columns -->
  <line x1="56" y1="194" x2="1144" y2="194" stroke="#e6e3db" stroke-width="1" />
  <line x1="56" y1="296" x2="1144" y2="296" stroke="#e6e3db" stroke-width="1" stroke-dasharray="3 4" />
  <line x1="56" y1="416" x2="1144" y2="416" stroke="#e6e3db" stroke-width="1" stroke-dasharray="3 4" />
  <line x1="56" y1="510" x2="1144" y2="510" stroke="#e6e3db" stroke-width="1" stroke-dasharray="3 4" />

  <!-- Vertical Divider between Scale, Left State, and Right State -->
  <line x1="216" y1="156" x2="216" y2="582" stroke="#e6e3db" stroke-width="1.5" />
  <line x1="664" y1="156" x2="664" y2="582" stroke="#e6e3db" stroke-width="1.5" />

  <!-- ==================== LEFT STATE: WHOLE-DOCUMENT REWRITE ==================== -->
  <g transform="translate(240, 0)">
    <text x="0" y="176" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" fill="#b3603f" letter-spacing="0.8">
      CONVENTIONAL AI RESUME REWRITER
    </text>

    <!-- Row 1: Unstructured Source -->
    <rect x="0" y="212" width="136" height="48" rx="6" fill="#f3f1ec" stroke="#d8d4ca" stroke-width="1.5" />
    <text x="16" y="234" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#1c1f25">generic_cv.md</text>
    <text x="16" y="250" font-family="IBM Plex Sans, -apple-system, sans-serif" font-size="11" fill="#606772">Flat prose blob</text>

    <line x1="136" y1="236" x2="178" y2="236" stroke="#b3603f" stroke-width="1.5" />
    <text x="186" y="232" font-family="IBM Plex Sans, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1c1f25">Prompt rewrites entire file</text>
    <text x="186" y="250" font-family="IBM Plex Sans, -apple-system, sans-serif" font-size="12" fill="#606772">No stable field IDs; previous edits overwrite base.</text>

    <!-- Row 2: 3 Disconnected Full Copies -->
    <!-- Connectors from source to 3 full copies -->
    <path d="M 68 260 L 68 314 M 68 282 L 194 282 L 194 314 M 194 282 L 320 282 L 320 314" stroke="#c0725f" stroke-width="1.5" fill="none" stroke-dasharray="3 3" />

    <!-- Copy 1 -->
    <g transform="translate(12, 314)">
      <rect x="0" y="0" width="112" height="78" rx="5" fill="#fbfaf7" stroke="#c0725f" stroke-width="1.5" />
      <rect x="10" y="12" width="92" height="6" rx="3" fill="#e5644e" fill-opacity="0.28" />
      <rect x="10" y="24" width="84" height="6" rx="3" fill="#e5644e" fill-opacity="0.28" />
      <rect x="10" y="36" width="92" height="6" rx="3" fill="#e5644e" fill-opacity="0.28" />
      <rect x="10" y="48" width="76" height="6" rx="3" fill="#e5644e" fill-opacity="0.28" />
      <text x="10" y="70" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#b3603f">cv_job1_final.pdf</text>
    </g>

    <!-- Copy 2 -->
    <g transform="translate(138, 314)">
      <rect x="0" y="0" width="112" height="78" rx="5" fill="#fbfaf7" stroke="#c0725f" stroke-width="1.5" />
      <rect x="10" y="12" width="88" height="6" rx="3" fill="#e5644e" fill-opacity="0.28" />
      <rect x="10" y="24" width="92" height="6" rx="3" fill="#e5644e" fill-opacity="0.45" />
      <rect x="10" y="36" width="70" height="6" rx="3" fill="#e5644e" fill-opacity="0.28" />
      <rect x="10" y="48" width="90" height="6" rx="3" fill="#e5644e" fill-opacity="0.28" />
      <text x="10" y="70" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#b3603f">cv_job2_v3.pdf</text>
    </g>

    <!-- Copy 3 -->
    <g transform="translate(264, 314)">
      <rect x="0" y="0" width="112" height="78" rx="5" fill="#fbfaf7" stroke="#c0725f" stroke-width="1.5" />
      <rect x="10" y="12" width="92" height="6" rx="3" fill="#e5644e" fill-opacity="0.28" />
      <rect x="10" y="24" width="80" height="6" rx="3" fill="#e5644e" fill-opacity="0.28" />
      <rect x="10" y="36" width="92" height="6" rx="3" fill="#e5644e" fill-opacity="0.45" />
      <rect x="10" y="48" width="86" height="6" rx="3" fill="#e5644e" fill-opacity="0.28" />
      <text x="10" y="70" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#b3603f">cv_job3_NEW.pdf</text>
    </g>

    <!-- Row 3: Fact Gate -->
    <rect x="0" y="434" width="388" height="54" rx="6" fill="#e5644e" fill-opacity="0.08" stroke="#e5644e" stroke-opacity="0.45" stroke-width="1.2" />
    <text x="14" y="456" font-family="IBM Plex Mono, monospace" font-size="11.5" font-weight="600" fill="#b3603f">
      ! Silent metric drift: "420ms &#8594; 180ms" reworded to "cut latency 70%"
    </text>
    <text x="14" y="476" font-family="IBM Plex Sans, -apple-system, sans-serif" font-size="12" fill="#606772">
      Prompt instructions ("do not fabricate") can still round or invent numbers.
    </text>

    <!-- Row 4: Review Surface Bar -->
    <text x="0" y="536" font-family="IBM Plex Sans, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1c1f25">
      300% document surface to proofread from scratch
    </text>
    <rect x="0" y="546" width="388" height="18" rx="4" fill="#e5644e" fill-opacity="0.22" stroke="#c0725f" stroke-width="1.2" />
    <rect x="0" y="546" width="388" height="18" rx="4" fill="#c0725f" fill-opacity="0.75" />
    <text x="12" y="559" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="600" fill="#fbfaf7">
      Every line of every generated file must be re-read before sending
    </text>
  </g>

  <!-- ==================== RIGHT STATE: APPLYDIFF BRANCHED HUNKS ==================== -->
  <g transform="translate(688, 0)">
    <text x="0" y="176" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" fill="#6f9440" letter-spacing="0.8">
      APPLYDIFF &#183; MASTER + PER-JOB HUNK BRANCHES
    </text>

    <!-- Row 1: Structured Master + Facts -->
    <rect x="0" y="212" width="162" height="48" rx="6" fill="#1a1712" stroke="#3d372c" stroke-width="1.5" />
    <circle cx="16" cy="230" r="4" fill="#ffb454" />
    <text x="26" y="234" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="#f0e6d2">master.json</text>
    <text x="16" y="250" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#a99b83">id: exp.1.b1, skills.*</text>

    <rect x="174" y="212" width="162" height="48" rx="6" fill="#2a1a0e" stroke="#b86b11" stroke-width="1.2" />
    <text x="188" y="234" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="#ffb454">facts.json</text>
    <text x="188" y="250" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f0e6d2">420ms&#8594;180ms &#183; 2.1M &#183; 99.95%</text>

    <!-- Row 2: Git Trunk + 3 Isolated Job Branches with Hunks -->
    <!-- Canonical Master Trunk Line -->
    <line x1="28" y1="260" x2="28" y2="396" stroke="#1c1f25" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="28" cy="276" r="5" fill="#fbfaf7" stroke="#1c1f25" stroke-width="3" />
    <circle cx="28" cy="396" r="5" fill="#1c1f25" />
    <text x="40" y="400" font-family="IBM Plex Mono, monospace" font-size="10" fill="#606772">master stays untouched</text>

    <!-- Branch Curve to Job Branches -->
    <path d="M 28 276 C 28 308, 64 316, 96 316" stroke="#b86b11" stroke-width="2.5" fill="none" />
    <path d="M 28 276 C 28 336, 64 348, 96 348" stroke="#b86b11" stroke-width="2.5" fill="none" />
    <path d="M 28 276 C 28 364, 64 380, 96 380" stroke="#b86b11" stroke-width="2.5" fill="none" />

    <!-- Branch 1 Hunk Pill -->
    <rect x="96" y="302" width="332" height="24" rx="5" fill="#9ccb5a" fill-opacity="0.18" stroke="#6f9440" stroke-width="1.2" />
    <text x="108" y="318" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="600" fill="#1c1f25">
      branch: stripe   <tspan fill="#6f9440">@@ exp.1.b1 @@</tspan>   <tspan fill="#606772">+1 hunk, 14 fields unchanged</tspan>
    </text>

    <!-- Branch 2 Hunk Pill -->
    <rect x="96" y="334" width="332" height="24" rx="5" fill="#9ccb5a" fill-opacity="0.18" stroke="#6f9440" stroke-width="1.2" />
    <text x="108" y="350" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="600" fill="#1c1f25">
      branch: gitlab   <tspan fill="#6f9440">@@ skills.platform @@</tspan> <tspan fill="#606772">+2 hunks, 13 unchanged</tspan>
    </text>

    <!-- Branch 3 Hunk Pill -->
    <rect x="96" y="366" width="332" height="24" rx="5" fill="#ffb454" fill-opacity="0.2" stroke="#b86b11" stroke-width="1.2" />
    <text x="108" y="382" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="600" fill="#1c1f25">
      branch: honor    <tspan fill="#b86b11">@@ summary.main @@</tspan>   <tspan fill="#606772">pending human approval</tspan>
    </text>

    <!-- Row 3: Deterministic Facts Gate -->
    <rect x="0" y="434" width="428" height="54" rx="6" fill="#9ccb5a" fill-opacity="0.14" stroke="#6f9440" stroke-width="1.2" />
    <text x="14" y="456" font-family="IBM Plex Mono, monospace" font-size="11.5" font-weight="600" fill="#3b571c">
      &#10003; Deterministic facts.json gate blocks any unverified number
    </text>
    <text x="14" y="476" font-family="IBM Plex Sans, -apple-system, sans-serif" font-size="12" fill="#1c1f25">
      Unbacked metrics are marked <tspan font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600">status: blocked</tspan>; PDF build exits <tspan font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600">code 3</tspan> until approved.
    </text>

    <!-- Row 4: Review Surface Bar (Proportional on same scale!) -->
    <text x="0" y="536" font-family="IBM Plex Sans, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1c1f25">
      Only changed hunks require review (~12% of lines)
    </text>
    <rect x="0" y="546" width="388" height="18" rx="4" fill="#e6e3db" />
    <rect x="0" y="546" width="54" height="18" rx="4" fill="#6f9440" />
    <text x="64" y="559" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="600" fill="#3b571c">
      Accept / Reject / Edit per hunk &#183; 88% inherited verbatim from master.json
    </text>
  </g>

  <!-- Editorial Source Footer -->
  <line x1="56" y1="590" x2="1144" y2="590" stroke="#e6e3db" stroke-width="1" />
  <text x="56" y="611" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#8d929b">
    Source: internal/tailor/hunk.go (pending | accepted | rejected | blocked) &#183; internal/runtime/exitcodes.go (ExitNeedsApproval = 3) &#183; examples/cv/facts.json
  </text>
</svg>
