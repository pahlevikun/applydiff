<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Desktop surface</title>
<style>
  body { margin: 0; background: #1c1f25; font-family: "IBM Plex Sans", sans-serif; color: #e8e6e1; }
  .wrap { padding: 48px; max-width: 880px; }
  .label { font-family: "IBM Plex Mono", monospace; color: #b86b11; font-size: 11px; letter-spacing: 0.12em; }
  h1 { color: #ffb454; font-size: 24px; }
  .window { border: 1px dashed #b86b11; border-radius: 12px; padding: 32px; background: #141820; }
  .scaffold { display: inline-block; margin-top: 12px; padding: 6px 10px; border: 1px dashed #ffb454; color: #ffb454; font-size: 12px; border-radius: 6px; }
  ul { line-height: 1.7; color: #c8c4bc; }
  code { font-family: "IBM Plex Mono", monospace; background: #0d0f12; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="label">SURFACE 05 · TAURI DESKTOP (SCAFFOLD)</div>
  <h1>ApplyDiff desktop</h1>
  <div class="window">
    <span class="scaffold">Not a shipping app yet — README + tauri.conf.json</span>
    <ul>
      <li>Sidecar: <code>applydiff serve --desktop --port 8787</code> → webview</li>
      <li>Second sidecar: Tectonic for PDF (planned)</li>
      <li>Menu: Install CLI on PATH · Connect Cursor / Claude</li>
    </ul>
  </div>
</div>
</body>
</html>
